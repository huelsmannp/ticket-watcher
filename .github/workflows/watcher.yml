name: Ticket Watcher

on:
  schedule:
    # Läuft automatisch alle 5 Minuten
    - cron: '*/5 * * * *'
  workflow_dispatch: # Erlaubt manuellen Start per Klick

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright & Browser installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Skript ausführen
        run: python ticket_watcher.py
